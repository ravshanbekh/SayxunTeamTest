# Production: Contabo (yoki istalgan VPS) uchun
#   cp .env.example .env   # qiymatlarni to'ldiring
#   docker compose up -d --build
# Batafsil: DEPLOY_CONTABO.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL - faqat ichki tarmoqda (tashqaridan ochiq emas)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
      POSTGRES_DB: ${POSTGRES_DB:-testing_platform}
      TZ: Asia/Tashkent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # FastAPI backend + admin panel + talaba test sahifasi
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-testplatform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-testing_platform}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env da berilishi shart}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SESSION_DURATION_MINUTES: ${SESSION_DURATION_MINUTES:-90}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
      RASCH_MAX_SCORE: ${RASCH_MAX_SCORE:-}
      TZ: Asia/Tashkent
    volumes:
      - uploads:/app/uploads
      - exports:/app/exports
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Telegram bot (polling)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN .env da berilishi shart}
      BACKEND_URL: http://backend:8000
      WEB_APP_URL: https://${DOMAIN:?DOMAIN .env da berilishi shart}
      TZ: Asia/Tashkent
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  # HTTPS (Let's Encrypt) reverse proxy - Telegram Mini App uchun HTTPS majburiy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
  uploads:
  exports:
  caddy_data:
  caddy_config:
